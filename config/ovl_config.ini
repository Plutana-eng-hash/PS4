# PS4 Overlay settings - Minecraft survival test profile.
# The in-game menu (SYS > Save settings) rewrites this file.

hud.fps = 1
hud.frametime = 1
hud.resolution = 1
hud.uptime = 1
hud.corner = 1          # 0 top-left, 1 top-right, 2 bottom-left, 3 bottom-right
hud.scale = 2           # 1-3

# Minecraft draws its own crosshair, so ours is off. Turn on in the menu to compare.
sight.enabled = 0
sight.style = 1         # 0 cross, 1 plus (gap), 2 dot, 3 box
sight.size = 12
sight.thickness = 2
sight.gap = 4
sight.color = 3         # 0 white 1 black 2 red 3 green 4 blue 5 yellow 6 cyan 7 pink
sight.outline = 1
sight.dot = 0

menu.theme = 0          # 0 dark (black/white), 1 light (white/black)
menu.scale = 2          # 1-3
menu.x = 4              # position, percent of free screen space
menu.y = 35
# Circle=drop item and Triangle=inventory in Minecraft, so the default combo is Touchpad+Options.
# The game never sees these presses.
menu.combo = 3          # 0 Circle+Triangle, 1 L3+R3, 2 L1+R1+Square, 3 Touchpad+Options
menu.hints = 1
menu.block_input = 1    # hide pad input from the game while the menu is open

render.layout = 0       # 0 auto, 1 linear, 2 tiled (try 1 or 2 if the picture looks scrambled)

notify.enabled = 1      # PS notifications: Starting. . . / Ready / Failed
notify.banner = 1       # on-screen "OVERLAY ACTIVE" banner for ~6 seconds after launch
