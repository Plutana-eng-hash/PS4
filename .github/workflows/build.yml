name: Build PS4 Overlay Plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Compile sources against host headers
        run: |
          for f in src/*.c; do
            gcc -std=c11 -fsyntax-only -Iinclude -Wall -Wextra "$f"
          done

  build:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make zip python3 curl

      - name: Restore OpenOrbis toolchain cache
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: openorbis-release-v4

      - name: Download latest OpenOrbis toolchain release
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          api=https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest
          url=$(curl -sL --fail "$api" | python3 -c "import json,sys; r=json.load(sys.stdin); a=[x['browser_download_url'] for x in r.get('assets',[]) if x['name'].endswith('.tar.gz')]; print(a[0] if a else '')")
          if [ -z "$url" ]; then
            echo "No .tar.gz asset found in the latest OpenOrbis release."
            exit 1
          fi
          echo "Downloading $url"
          curl -sL --fail "$url" -o toolchain.tar.gz
          tar -xzf toolchain.tar.gz -C toolchain
          rm -f toolchain.tar.gz

      - name: Locate toolchain and export OO_PS4_TOOLCHAIN
        run: |
          inc=$(find toolchain -maxdepth 4 -type d -name include | head -n 1)
          if [ -z "$inc" ]; then
            echo "No include directory found in the toolchain. Contents of toolchain/:"
            find toolchain -maxdepth 3 | head -n 50
            exit 1
          fi
          root=$(cd "$(dirname "$inc")" && pwd)
          echo "OO_PS4_TOOLCHAIN=$root" >> "$GITHUB_ENV"
          echo "Toolchain root: $root"
          if [ -d "$root/bin/linux" ]; then
            chmod -R +x "$root/bin/linux"
          fi

      - name: Show toolchain library sample build recipe
        if: always()
        run: |
          echo "Samples directory:"
          ls "$OO_PS4_TOOLCHAIN/samples" 2>/dev/null || ls toolchain/OpenOrbis/PS4Toolchain/samples 2>/dev/null || echo "no samples dir found"
          for mk in $(find "$OO_PS4_TOOLCHAIN/samples" -name Makefile 2>/dev/null); do
            if grep -qi 'prx\|sprx\|lib' "$mk"; then
              echo "=== $mk ==="
              cat "$mk"
            fi
          done

      - name: Dump toolchain layout (diagnostic)
        if: always()
        run: |
          echo "=== lib ==="; ls -la "$OO_PS4_TOOLCHAIN/lib" | head -60
          echo "=== link.x ==="; cat "$OO_PS4_TOOLCHAIN/link.x"
          echo "=== bin/linux ==="; ls -la "$OO_PS4_TOOLCHAIN/bin/linux"

      - name: Build SPRX
        run: make OO_PS4_TOOLCHAIN="$OO_PS4_TOOLCHAIN"

      - name: Package zip
        run: make package OO_PS4_TOOLCHAIN="$OO_PS4_TOOLCHAIN"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4_overlay_plugin
          path: dist/ps4_overlay_plugin.zip
          if-no-files-found: error
