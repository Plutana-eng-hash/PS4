name: Build PS4 Overlay Plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Compile sources against host headers
        run: |
          set -eu
          for f in src/*.c; do
            gcc -std=c11 -fsyntax-only -Iinclude -Wall -Wextra "$f"
          done

  build:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make zip python3 curl

      - name: Restore OpenOrbis toolchain cache
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: openorbis-release-v4

      - name: Download OpenOrbis toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p toolchain
          api=https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest
          url=$(curl --retry 3 --retry-all-errors -fsSL "$api" | python3 -c "import json,sys; r=json.load(sys.stdin); a=[x['browser_download_url'] for x in r.get('assets',[]) if x['name'].endswith('.tar.gz')]; print(a[0] if a else '')")
          if [ -z "$url" ]; then
            echo "No .tar.gz asset found in the latest OpenOrbis release."
            exit 1
          fi
          curl --retry 3 --retry-all-errors -fsSL "$url" -o toolchain.tar.gz
          tar -xzf toolchain.tar.gz -C toolchain
          rm -f toolchain.tar.gz

      - name: Locate and validate toolchain
        run: |
          set -eu
          inc=$(find toolchain -type d -name include -print -quit)
          if [ -z "$inc" ]; then
            echo "No toolchain include directory found."
            find toolchain -maxdepth 5 -print | head -n 80
            exit 1
          fi
          root=$(cd "$(dirname "$inc")" && pwd)
          test -f "$root/link.x" || { echo "Missing link.x under $root"; exit 1; }
          test -f "$root/bin/linux/create-fself" || { echo "Missing create-fself under $root"; exit 1; }
          echo "OO_PS4_TOOLCHAIN=$root" >> "$GITHUB_ENV"
          chmod -R +x "$root/bin/linux"

      - name: Build SPRX
        run: make OO_PS4_TOOLCHAIN="$OO_PS4_TOOLCHAIN"

      - name: Package zip
        run: make package OO_PS4_TOOLCHAIN="$OO_PS4_TOOLCHAIN"

      - name: Verify package
        run: test -s dist/ps4_overlay_plugin.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4_overlay_plugin
          path: dist/ps4_overlay_plugin.zip
          if-no-files-found: error
