<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overlay UI Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font:14px/1.4 Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.panel{width:min(760px,95vw);background:#090909;border:1px solid #666;box-shadow:0 24px 80px #000;padding:0}.top{padding:20px 22px 14px;border-bottom:1px solid #444;display:flex;justify-content:space-between;align-items:center}.title{font-weight:800;letter-spacing:3px;font-size:19px}.muted{color:#858585;font-size:11px;letter-spacing:1px}.tabs{display:flex;border-bottom:1px solid #444;padding:10px;gap:6px}.tab{flex:1;background:#090909;color:#aaa;border:1px solid #444;padding:11px 6px;font-weight:700;letter-spacing:1px;cursor:pointer}.tab.active{background:#fff;color:#000;border-color:#fff}.content{padding:20px 22px;min-height:320px}.section{font-size:11px;letter-spacing:1.5px;color:#888;margin-bottom:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 2px;border-bottom:1px solid #242424}.name{font-weight:600}.desc{font-size:12px;color:#777;margin-top:4px}.square{width:30px;height:30px;border:1px solid #777;background:#101010;color:#888;display:grid;place-items:center;cursor:pointer;font-weight:900}.square.on{background:#fff;border-color:#fff;color:#000}.sliderbox{display:flex;align-items:center;gap:10px;width:240px}.slider{appearance:none;width:150px;height:5px;background:#333;outline:none}.slider::-webkit-slider-thumb{appearance:none;width:12px;height:16px;background:#fff;border:1px solid #fff;cursor:pointer}.slider::-moz-range-thumb{width:12px;height:16px;background:#fff;border:1px solid #fff;border-radius:0;cursor:pointer}.value{width:46px;border:1px solid #444;background:#111;padding:6px;text-align:center;font-variant-numeric:tabular-nums}.choice{border:1px solid #444;background:#111;color:#ddd;padding:7px 9px;cursor:pointer;min-width:110px;text-align:center}.foot{border-top:1px solid #444;color:#777;font-size:11px;letter-spacing:1px;padding:12px 22px;display:flex;justify-content:space-between}.actions{display:flex;gap:8px}.action{border:1px solid #555;background:#111;color:#eee;padding:9px 12px;cursor:pointer}.action:hover,.square:hover,.choice:hover{border-color:#fff}.notice{color:#bbb;font-size:12px;margin-top:14px}
</style></head><body><main class="panel"><header class="top"><div><div class="title">CONTROL PANEL</div><div class="muted">MONOCHROME UI PREVIEW</div></div><div class="muted">UI DEMO / 01</div></header><nav class="tabs" id="tabs"></nav><section class="content"><div class="section" id="sectionTitle"></div><div id="rows"></div><div class="notice" id="notice"></div></section><footer class="foot"><span>ARROW KEYS · ENTER</span><div class="actions"><button class="action" id="reset">RESET</button></div></footer></main>
<script>
const pages={DISPLAY:[{n:"Compact layout",d:"Reduce row spacing",t:"toggle",v:false},{n:"Status display",d:"Show status information",t:"toggle",v:true},{n:"Scale",d:"Adjust interface size",t:"slider",v:100,min:70,max:130},{n:"Opacity",d:"Panel opacity",t:"slider",v:90,min:30,max:100}],APPEARANCE:[{n:"High contrast",d:"Increase contrast",t:"toggle",v:true},{n:"Border weight",d:"Outline thickness",t:"slider",v:1,min:1,max:4},{n:"Density",d:"Spacing preset",t:"choice",v:"Normal",opts:["Compact","Normal","Wide"]}],CONTROLS:[{n:"Controller hints",d:"Show navigation hints",t:"toggle",v:true},{n:"Repeat rate",d:"Key repeat speed",t:"slider",v:3,min:1,max:10},{n:"Navigation style",d:"Interaction preset",t:"choice",v:"Standard",opts:["Standard","Fast"]}],SYSTEM:[{n:"Preview notifications",d:"Demo only",t:"toggle",v:false},{n:"Preview mode",d:"This page is independent of the game plugin",t:"choice",v:"Standalone",opts:["Standalone","Windowed"]}]};
let page="DISPLAY";const tabs=document.getElementById("tabs"),rows=document.getElementById("rows");
function render(){tabs.innerHTML="";Object.keys(pages).forEach(k=>{let b=document.createElement("button");b.className="tab"+(k===page?" active":"");b.textContent=k;b.onclick=()=>{page=k;render()};tabs.append(b});});document.getElementById("sectionTitle").textContent=page+" SETTINGS";rows.innerHTML="";pages[page].forEach((item,i)=>{let r=document.createElement("div");r.className="row";let label=document.createElement("div");label.innerHTML='<div class="name">'+item.n+'</div><div class="desc">'+item.d+'</div>';r.append(label);if(item.t==="toggle"){let b=document.createElement("button");b.className="square"+(item.v?" on":"");b.textContent=item.v?"✓":"—";b.setAttribute("aria-label",item.n+" toggle");b.onclick=()=>{item.v=!item.v;render()};r.append(b)}else if(item.t==="slider"){let box=document.createElement("div");box.className="sliderbox";let s=document.createElement("input");s.className="slider";s.type="range";s.min=item.min;s.max=item.max;s.value=item.v;let v=document.createElement("div");v.className="value";v.textContent=item.v+(item.n==="Scale"?"%":"");s.oninput=()=>{item.v=+s.value;v.textContent=item.v+(item.n==="Scale"?"%":"")};box.append(s,v);r.append(box)}else{let b=document.createElement("button");b.className="choice";b.textContent="‹ "+item.v+" ›";b.onclick=()=>{let j=item.opts.indexOf(item.v);item.v=item.opts[(j+1)%item.opts.length];render()};r.append(b)}rows.append(r)});document.getElementById("notice").textContent="All controls are UI-only preview settings."; }
document.getElementById("reset").onclick=()=>{Object.values(pages).flat().forEach(i=>{if(i.t==="toggle")i.v=false;if(i.t==="slider")i.v=i.min;if(i.t==="choice")i.v=i.opts[0]});page="DISPLAY";render()};document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){let ks=Object.keys(pages),i=ks.indexOf(page);page=ks[(i+(e.key==="ArrowRight"?1:ks.length-1))%ks.length];render()}});render();
</script></body></html>
